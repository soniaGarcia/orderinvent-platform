version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # MICROSERVICIOS (Rutas relativas hacia carpetas hermanas)
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: ../orderinvent-order-service   # <-- Sale de platform y entra al repo de order
      dockerfile: Dockerfile
    container_name: orderinvent-order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8081/api/v1/inventory
    depends_on:
      - kafka
    networks:
      - orderinvent-net

  inventory-service:
    build:
      context: ../orderinvent-inventory-service # <-- Sale de platform y entra al repo de inventory
      dockerfile: Dockerfile
    container_name: orderinvent-inventory-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:inventory_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092   
    depends_on:
      kafka:
        condition: service_healthy                   
    networks:
      - orderinvent-net

  notification-service:
    build:
      context: ../orderinvent-notification-service # <-- Sale de platform y entra al repo de notification
      dockerfile: Dockerfile
    container_name: orderinvent-notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - orderinvent-net

  # ---------------------------------------------------------------------------
  # INFRAESTRUCTURA COMPARTIDA (Kafka / Eventos)
  # ---------------------------------------------------------------------------

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - orderinvent-net

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: orderinvent-kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - orderinvent-net

networks:
  orderinvent-net:
    driver: bridge     